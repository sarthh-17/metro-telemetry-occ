<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMRL - Metro Operations & Fleet Management System</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            railway: {
              950: '#05111e',
              900: '#0f2b46',
              800: '#003366',
              700: '#024b8e',
              600: '#005bb5',
              50: '#f0f4f8'
            },
            kmrl: {
              teal: '#00a896',
              darkteal: '#028090',
              lightteal: '#e6f7f5',
              cyan: '#00b4d8',
              amber: '#d97706'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Railway styling additions */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f9;
      color: #1e293b;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #e2e8f0;
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* Pulse effects for live radar/status */
    @keyframes statusPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    .status-pulse {
      animation: statusPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes emergencyFlash {
      0%, 100% { background-color: rgba(220, 38, 38, 0.15); }
      50% { background-color: rgba(220, 38, 38, 0.35); }
    }
    .emergency-banner {
      animation: emergencyFlash 1.2s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-100 text-slate-800 antialiased selection:bg-kmrl-teal selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- MOCK INITIAL DATA ---
    const INITIAL_OPERATORS = [
      { id: 'DISPATCHER.4', name: 'R. Rajesh Nair', location: 'Muttom OCC HQ', role: 'Chief Dispatcher', shift: 'Morning Shift (06:00 - 14:00)' },
      { id: 'DEPOT_SUP.2', name: 'A. Menon', location: 'Kalamassery Yard', role: 'Depot Superintendent', shift: 'General Shift (08:30 - 17:00)' },
      { id: 'SAFETY_AUDITOR', name: 'K. Varma', location: 'KMRL Bhavan', role: 'Chief Safety Auditor', shift: '24h Duty Rotation' }

    const STATIONS_LINE_1 = [

      { id: 'ST-14', name: 'Maharajas College', code: 'MHC', distKm: 16.5, type: 'Regular' },
      { id: 'ST-15', name: 'Ernakulam South', code: 'ERS', distKm: 18.2, type: 'Railway Interchange' },

      { id: 'ST-17', name: 'Elamkulam', code: 'ELMK', distKm: 20.8, type: 'Regular' },
      { id: 'ST-18', name: 'Vytilla', code: 'VYTL', distKm: 22.1, type: 'Mobility Hub' },
      { id: 'ST-19', name: 'Thykkoodam', code: 'TKDM', distKm: 23.4, type: 'Regular' },
      { id: 'ST-20', name: 'Pettah', code: 'PTAH', distKm: 24.6, type: 'Regular' },
      { id: 'ST-21', name: 'Vadakkekotta', code: 'VDKK', distKm: 25.8, type: 'Regular' },
      { id: 'ST-22', name: 'SN Junction', code: 'SNJ', distKm: 26.9, type: 'Regular' },
      { id: 'ST-23', name: 'Thripunithura', code: 'TPTR', distKm: 28.1, type: 'Terminal' }
    ];

    const INITIAL_RAKES = [
      { id: 'R-101', status: 'In Service', mileage: 84250, fitnessExp: '2027-04-15', health: 98, block: 'S-12 (Kaloor)', speed: 54, voltage: 748, motorTemp: 42, hvacPress: 4.2, driver: 'S. Kumar (D-102)' },
      { id: 'R-102', status: 'In Service', mileage: 92100, fitnessExp: '2026-11-20', health: 95, block: 'S-18 (Vytilla)', speed: 48, voltage: 752, motorTemp: 44, hvacPress: 4.1, driver: 'M. Jacob (D-114)' },
      { id: 'TR-6031', status: 'Maintenance', mileage: 115400, fitnessExp: '2026-10-30', health: 72, block: 'S-88 (Interlock Wait)', speed: 0, voltage: 0, motorTemp: 28, hvacPress: 0.0, driver: 'UNASSIGNED' },
      { id: 'R-104', status: 'Fit For Service', mileage: 68900, fitnessExp: '2027-01-12', health: 99, block: 'Kalamassery Depot', speed: 0, voltage: 750, motorTemp: 31, hvacPress: 4.3, driver: 'STANDBY' },
      { id: 'R-105', status: 'In Service', mileage: 77320, fitnessExp: '2027-03-05', health: 94, block: 'S-05 (Kalamassery)', speed: 60, voltage: 751, motorTemp: 46, hvacPress: 4.0, driver: 'V. Thomas (D-201)' },
      { id: 'R-106', status: 'Fit For Service', mileage: 54100, fitnessExp: '2027-08-22', health: 97, block: 'Muttom Yard Track 3', speed: 0, voltage: 749, motorTemp: 30, hvacPress: 4.2, driver: 'STANDBY' },
      { id: 'R-107', status: 'In Service', mileage: 88400, fitnessExp: '2026-12-01', health: 91, block: 'S-22 (SN Junction)', speed: 52, voltage: 745, motorTemp: 48, hvacPress: 3.9, driver: 'P. Pradeep (D-108)' },
      { id: 'R-108', status: 'Maintenance', mileage: 128900, fitnessExp: '2026-10-25', health: 68, block: 'Kalamassery Bay 2', speed: 0, voltage: 0, motorTemp: 26, hvacPress: 0.0, driver: 'MAINT_CREW_B' },
      { id: 'R-109', status: 'Fit For Service', mileage: 42000, fitnessExp: '2027-09-10', health: 100, block: 'Muttom Stabling Line 1', speed: 0, voltage: 750, motorTemp: 29, hvacPress: 4.3, driver: 'STANDBY' },
      { id: 'R-110', status: 'In Service', mileage: 96500, fitnessExp: '2026-11-05', health: 93, block: 'S-08 (Edapally)', speed: 58, voltage: 753, motorTemp: 45, hvacPress: 4.1, driver: 'A. Joseph (D-119)' },
      { id: 'R-111', status: 'Out of Service', mileage: 142000, fitnessExp: '2026-09-30', health: 55, block: 'Muttom Heavy Repair Bay', speed: 0, voltage: 0, motorTemp: 25, hvacPress: 0.0, driver: 'NONE' },
      { id: 'R-112', status: 'Fit For Service', mileage: 31200, fitnessExp: '2027-11-18', health: 99, block: 'Kalamassery Stabling', speed: 0, voltage: 750, motorTemp: 28, hvacPress: 4.3, driver: 'STANDBY' }
    ];

    const INITIAL_ACTIVITY_LOGS = [
      { id: 1, time: '14:22:10', type: 'DISPATCH', text: 'Extra rake R-104 assigned to Line 1 Northbound (Aluva Express).', severity: 'info' },
      { id: 2, time: '14:15:00', type: 'SAFETY', text: 'Line Interlock Active: TR-6031 on Block S-88 (Interlock sensor wait signal). Inspector team notified.', severity: 'warning' },
      { id: 3, time: '14:02:45', type: 'TELEMETRY', text: 'Rake R-102 telemetry sync confirmed: Pantograph voltage stable at 752V DC.', severity: 'success' },
      { id: 4, time: '13:48:30', type: 'MAINTENANCE', text: 'R-108 scheduled HVAC maintenance initiated at Kalamassery Bay 2.', severity: 'neutral' },
      { id: 5, time: '13:30:12', type: 'INSPECTION', text: 'Annual Fitness Certificate issued for Rake R-109 (Valid till Sep 2027).', severity: 'success' }
    ];

    const INITIAL_INTERLOCKS = [
      { id: 'INT-8802', trainId: 'TR-6031', block: 'BLOCK S-88', cause: 'Interlock sensor wait signal. Track inspector team notified.', status: 'ACTIVE HOLD', time: '14:15 UTC', speedCap: '0 km/h' }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentModule, setCurrentModule] = useState('dashboard'); // dashboard, occ, fleet, map, safety, analytics
      const [activeOperator, setActiveOperator] = useState(INITIAL_OPERATORS[0]);
      const [showOperatorModal, setShowOperatorModal] = useState(false);
      
      // Data States
      const [rakes, setRakes] = useState(INITIAL_RAKES);
      const [interlocks, setInterlocks] = useState(INITIAL_INTERLOCKS);
      const [activityLogs, setActivityLogs] = useState(INITIAL_ACTIVITY_LOGS);
      const [isAllStopActive, setIsAllStopActive] = useState(false);

      // Clocks
      const [utcTime, setUtcTime] = useState('');
      const [istTime, setIstTime] = useState('');

      // UI States
      const [toasts, setToasts] = useState([]);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [showNotificationsMenu, setShowNotificationsMenu] = useState(false);

      // Modals
      const [showDispatchModal, setShowDispatchModal] = useState(false);
      const [showEmergencyModal, setShowEmergencyModal] = useState(false);
      const [showInterlockModal, setShowInterlockModal] = useState(null);

      // Clock effect
      useEffect(() => {
        const updateClocks = () => {
          const now = new Date();
          setUtcTime(now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC');
          setIstTime(now.toLocaleTimeString('en-IN', { hour12: false, timeZone: 'Asia/Kolkata' }) + ' IST');
        };
        updateClocks();
        const interval = setInterval(updateClocks, 1000);
        return () => clearInterval(interval);
      }, []);

      // Toast notification helper
      const addToast = useCallback((message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4500);
      }, []);

      // Refresh Data Action
      const handleRefreshData = () => {
        setIsRefreshing(true);
        setTimeout(() => {
          setIsRefreshing(false);
          addToast('System telemetry & fleet database synchronized with OCC HQ.', 'success');
        }, 700);
      };

      // Add activity log helper
      const addActivityLog = (text, type = 'SYSTEM', severity = 'info') => {
        const now = new Date();
        const timeStr = now.toTimeString().substring(0, 8);
        const newLog = { id: Date.now(), time: timeStr, type, text, severity };
        setActivityLogs(prev => [newLog, ...prev.slice(0, 24)]);
      };

      // Metrics computations
      const metrics = useMemo(() => {
        const totalRakes = 48; // Full system inventory (represented by 12 mock detail entries)
        const inService = rakes.filter(r => r.status === 'In Service').length;
        const fitReady = rakes.filter(r => r.status === 'Fit For Service').length;
        const maintenance = rakes.filter(r => r.status === 'Maintenance').length;
        const outOfService = rakes.filter(r => r.status === 'Out of Service').length;
        const activeSafetyHolds = interlocks.length + (isAllStopActive ? 1 : 0);
        return { totalRakes, inService, fitReady, maintenance, outOfService, activeSafetyHolds, onTimeIndex: '98.4%', headwayAvg: '±14s' };
      }, [rakes, interlocks, isAllStopActive]);

      // All Stop Execution
      const executeAllStop = () => {
        setIsAllStopActive(true);
        setRakes(prev => prev.map(r => r.status === 'In Service' ? { ...r, speed: 0, status: 'In Service' } : r));
        addActivityLog('EMERGENCY ALL STOP PROTOCOL ACTIVATED BY DISPATCHER. ALL TRAINS HALTED.', 'EMERGENCY', 'danger');
        addToast('ALL STOP PROTOCOL EXECUTED. Mandatory emergency hold broadcasted.', 'danger');
        setShowEmergencyModal(false);
      };

      const resumeAllStop = () => {
        setIsAllStopActive(false);
        addActivityLog('Emergency All Stop Protocol revoked. Normal signaling resumed.', 'SAFETY', 'success');
        addToast('Safety emergency hold cleared. Dispatch operations resumed.', 'success');
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* EMERGENCY ALL STOP FULL-SCREEN BANNER IF ACTIVE */}
          {isAllStopActive && (
            <div className="bg-red-600 text-white font-mono px-4 py-2.5 flex items-center justify-between shadow-lg z-50 emergency-banner border-b-2 border-red-800">
              <div className="flex items-center space-x-3">
                <span className="text-xl animate-bounce">⚠️</span>
                <div>
                  <span className="font-bold text-lg tracking-wider">SYSTEM-WIDE EMERGENCY ALL STOP ACTIVE</span>
                  <span className="text-xs text-red-100 ml-3">All track signals set to RED Danger. Traction power interlocked.</span>
                </div>
              </div>
              <button 
                onClick={resumeAllStop}
                className="bg-white text-red-700 hover:bg-red-50 text-xs font-bold px-4 py-1.5 rounded shadow transition-colors"
              >
                REVOKE ALL STOP & RESUME SIGNALING
              </button>
            </div>
          )}

          {/* TOP HEADER / SYSTEM STATUS BAR */}
          <header className="bg-railway-900 text-white border-b border-railway-800 sticky top-0 z-40 shadow-md">
            <div className="px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
              {/* Logo & Portal Identity */}
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-kmrl-teal flex items-center justify-center text-white font-bold text-xl shadow-inner border border-teal-300/30">
                  <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                  </svg>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-extrabold tracking-wider text-base text-white">KOCHI METRO RAIL LIMITED</span>
                    <span className="bg-kmrl-teal/20 text-teal-300 border border-teal-500/40 text-[10px] font-mono px-1.5 py-0.5 rounded uppercase">Official Portal</span>
                  </div>
                  <p className="text-xs text-slate-300 font-mono tracking-wide">METRO OPERATIONS & FLEET MANAGEMENT SYSTEM</p>
                </div>
              </div>

              {/* Status & Live Indicators */}
              <div className="flex items-center flex-wrap gap-3 text-xs">
                {/* System Status Pill */}
                <div className="flex items-center bg-railway-950/80 border border-railway-700 rounded px-2.5 py-1 space-x-2 font-mono">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 status-pulse"></span>
                  <span className="text-emerald-400 font-bold tracking-wide">SYS.ONLINE</span>
                </div>

                {/* UTC & IST Clocks */}
                <div className="hidden sm:flex flex-col text-right font-mono text-[11px] bg-railway-950/60 px-3 py-1 rounded border border-railway-800">
                  <span className="text-slate-300">{utcTime || '2026-10-22 14:24:00 UTC'}</span>
                  <span className="text-teal-300 font-semibold">{istTime || '19:54:00 IST'}</span>
                </div>

                {/* Safety Holds Counter Badge */}
                <div 
                  onClick={() => setCurrentModule('safety')}
                  className={`flex items-center space-x-1.5 px-2.5 py-1 rounded font-mono font-bold cursor-pointer transition-colors border ${
                    metrics.activeSafetyHolds > 0 
                      ? 'bg-amber-500/20 text-amber-300 border-amber-500/40 hover:bg-amber-500/30' 
                      : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                  }`}
                  title="Click to view Active Safety Desk"
                >
                  <span className="text-sm">⚠️</span>
                  <span>{metrics.activeSafetyHolds} SAFETY HOLD</span>
                </div>

                {/* Notifications Bell Dropdown */}
                <div className="relative">
                  <button 
                    onClick={() => setShowNotificationsMenu(!showNotificationsMenu)}
                    className="p-1.5 rounded bg-railway-800 hover:bg-railway-700 border border-railway-700 text-slate-200 transition-colors relative"
                    title="Operational System Alerts"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                    </svg>
                    {activityLogs.some(l => l.severity === 'warning' || l.severity === 'danger') && (
                      <span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-red-500 border border-railway-900"></span>
                    )}
                  </button>

                  {/* Dropdown Menu */}
                  {showNotificationsMenu && (
                    <div className="absolute right-0 mt-2 w-80 bg-white text-slate-800 rounded-md shadow-2xl border border-slate-300 py-2 z-50 font-sans">
                      <div className="px-3 py-1.5 border-b border-slate-200 flex items-center justify-between">
                        <span className="font-bold text-xs uppercase tracking-wider text-slate-700">Live System Alerts</span>
                        <span className="text-[10px] bg-slate-100 font-mono px-1.5 py-0.5 rounded text-slate-500">{activityLogs.length} events</span>
                      </div>
                      <div className="max-h-64 overflow-y-auto divide-y divide-slate-100">
                        {activityLogs.map(log => (
                          <div key={log.id} className="p-2.5 text-xs hover:bg-slate-50 transition-colors">
                            <div className="flex items-center justify-between font-mono text-[10px] text-slate-400 mb-0.5">
                              <span className="font-semibold text-railway-800">[{log.type}]</span>
                              <span>{log.time}</span>
                            </div>
                            <p className="text-slate-700 leading-snug">{log.text}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* Operator Profile Badge Button */}
                <button 
                  onClick={() => setShowOperatorModal(true)}
                  className="flex items-center space-x-2 bg-railway-800 hover:bg-railway-700 border border-railway-700 px-2.5 py-1 rounded text-left transition-colors"
                >
                  <div className="w-5 h-5 rounded-full bg-kmrl-teal text-white flex items-center justify-center font-bold text-[10px]">
                    {activeOperator.id.substring(0, 2)}
                  </div>
                  <div className="hidden md:block">
                    <div className="font-mono text-[11px] font-bold text-teal-300 leading-none">{activeOperator.id}</div>
                    <div className="text-[9px] text-slate-300 leading-none mt-0.5">{activeOperator.location}</div>
                  </div>
                  <span className="text-slate-400 text-[10px]">▼</span>
                </button>

                {/* Refresh Data Trigger */}
                <button
                  onClick={handleRefreshData}
                  disabled={isRefreshing}
                  className="bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-white font-mono text-xs px-2.5 py-1 rounded border border-slate-600 flex items-center space-x-1 transition-all"
                >
                  <span className={isRefreshing ? 'animate-spin' : ''}>↻</span>
                  <span className="hidden sm:inline">REFRESH DATA</span>
                </button>
              </div>
            </div>
          </header>

          {/* MAIN LAYOUT WITH PERSISTENT SIDEBAR */}
          <div className="flex flex-1 overflow-hidden">
            {/* SIDEBAR NAVIGATION */}
            <aside className="w-16 md:w-64 bg-railway-900 text-slate-300 flex flex-col border-r border-railway-800 shrink-0">
              <div className="p-3 text-[11px] font-mono font-bold text-slate-400 uppercase tracking-wider hidden md:block border-b border-railway-800/60">
                Navigation Modules
              </div>
              <nav className="flex-1 p-2 space-y-1 overflow-y-auto">
                <NavItem 
                  id="dashboard" 
                  icon="📊" 
                  label="Overview Dashboard" 
                  badge={null}
                  active={currentModule === 'dashboard'} 
                  onClick={() => setCurrentModule('dashboard')} 
                />
                <NavItem 
                  id="occ" 
                  icon="🎛️" 
                  label="Operations Control Center" 
                  badge={metrics.inService ? `${metrics.inService} Active` : null}
                  badgeColor="bg-teal-500/20 text-teal-300 border-teal-500/30"
                  active={currentModule === 'occ'} 
                  onClick={() => setCurrentModule('occ')} 
                />
                <NavItem 
                  id="fleet" 
                  icon="🔧" 
                  label="Fleet & Telemetry" 
                  badge={metrics.maintenance ? `${metrics.maintenance} Maint.` : null}
                  badgeColor="bg-amber-500/20 text-amber-300 border-amber-500/30"
                  active={currentModule === 'fleet'} 
                  onClick={() => setCurrentModule('fleet')} 
                />
                <NavItem 
                  id="map" 
                  icon="🛤️" 
                  label="Live Line & Route Map" 
                  badge="Line 1"
                  badgeColor="bg-blue-500/20 text-blue-300 border-blue-500/30"
                  active={currentModule === 'map'} 
                  onClick={() => setCurrentModule('map')} 
                />
                <NavItem 
                  id="safety" 
                  icon="⚠️" 
                  label="Safety & Incident Desk" 
                  badge={metrics.activeSafetyHolds > 0 ? `${metrics.activeSafetyHolds} Hold` : 'OK'}
                  badgeColor={metrics.activeSafetyHolds > 0 ? "bg-red-500/20 text-red-300 border-red-500/30" : "bg-emerald-500/20 text-emerald-300 border-emerald-500/30"}
                  active={currentModule === 'safety'} 
                  onClick={() => setCurrentModule('safety')} 
                />
                <NavItem 
                  id="analytics" 
                  icon="📈" 
                  label="Analytics & Fitness Reports"

      const [filter, setFilter] = useState('All');

      const filteredRakes = useMemo(() => {
        return rakes.filter(rake => {
          const matchesFilter = filter === 'All' || rake.status === filter;
          const matchesSearch = rake.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                rake.block.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                rake.driver.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesFilter && matchesSearch;
        });
      }, [rakes, filter, searchQuery]);

      // Telemetry Form Submit
      const handleTelemetrySubmit = (e) => {
        e.preventDefault();
        if (!telemetryRakeId) return;

        setRakes(prev => prev.map(r => {
          if (r.id === telemetryRakeId) {
            return {
              ...r,
              mileage: telemetryMileage ? parseInt(telemetryMileage) : r.mileage,
              status: telemetryStatus,
              voltage: parseInt(telemetryVoltage) || 750
            };
          }
          return r;
        }));

        addActivityLog(`Telemetry data updated for Rake ${telemetryRakeId}: Mileage ${telemetryMileage || 'Unchanged'}, Status ${telemetryStatus}.`, 'TELEMETRY', 'success');
        addToast(`Telemetry for ${telemetryRakeId} recorded successfully.`, 'success');
        setTelemetryMileage('');

          {selectedStation && (
            <Modal title={`Station Details: ${selectedStation.name} (${selectedStation.code})`} onClose={() => setSelectedStation(null)}>
              <div className="space-y-3 font-mono text-xs">
                <div className="flex justify-between border-b pb-2">
                  <span className="text-slate-500">Distance from Aluva:</span>
                  <span className="font-bold">{selectedStation.distKm} km</span>
                </div>
                <div className="flex justify-between border-b pb-2">
                  <span className="text-slate-500">Station Type:</span>
                  <span className="font-bold text-railway-800">{selectedStation.type}</span>
                </div>
                <div className="flex justify-between border-b pb-2">
                  <span className="text-slate-500">Platforms:</span>
                  <span className="font-bold">2 Side Platforms</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-500">CCTV & PSD Sensors:</span>
                  <span className="font-bold text-emerald-600">OPERATIONAL</span>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // --- MODULE FOUR: SAFETY & INCIDENT DESK ---
    function ViewSafety({ interlocks, setInterlocks, activityLogs, addToast, addActivityLog, isAllStopActive, resumeAllStop }) {
      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between pb-3 border-b border-slate-200 gap-3">
            <div>
              <div className="flex items-center space-x-2 font-mono text-xs text-slate-500 uppercase">
                <span>MODULE FOUR</span>
                <span>/</span>
                <span className="text-railway-800 font-bold">SAFETY DESK</span>
              </div>
              <h1 className="text-2xl font-extrabold text-railway-900 tracking-tight font-mono">
                Safety, Interlocks & Incident Audit
              </h1>
            </div>
            <div className="font-mono text-xs bg-red-100 text-red-800 px-2.5 py-1 rounded border border-red-300 font-bold">
              {interlocks.length + (isAllStopActive ? 1 : 0)} Active Safety Holds
            </div>
          </div>

          {/* Emergency State Handling */}
          {isAllStopActive && (
            <div className="p-4 bg-red-50 border border-red-300 rounded-xl flex items-center justify-between font-mono text-xs text-red-900">
              <div>
                <span className="font-bold text-sm">GLOBAL EMERGENCY HALT IN EFFECT</span>
                <p className="text-red-700 mt-0.5">All signals set to RED. Require safety auditor override to resume.</p>
              </div>
              <button 
                onClick={resumeAllStop}
                className="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded transition-colors"
              >
                REVOKE EMERGENCY HALT
              </button>
            </div>
          )}

          {/* Active Line Interlocks List */}
          <div className="bg-white rounded-xl p-5 shadow-sm border border-slate-200 space-y-3">
            <h2 className="font-mono text-xs font-bold text-slate-700 uppercase tracking-wider border-b border-slate-100 pb-2">
              Active Track Interlocks
            </h2>
            {interlocks.length === 0 ? (
              <p className="text-xs font-mono text-slate-500 text-center py-4">No active safety holds or track interlocks recorded.</p>
            ) : (
              interlocks.map(lock => (
                <div key={lock.id} className="p-4 bg-amber-50 rounded-lg border border-amber-200 flex flex-col md:flex-row md:items-center justify-between gap-3 font-mono text-xs">
                  <div>
                    <div className="font-bold text-amber-900 text-sm">{lock.trainId} — {lock.block}</div>
                    <div className="text-amber-800 mt-1">{lock.cause}</div>
                    <div className="text-[10px] text-amber-600 mt-1">Status: {lock.status} | Speed Cap: {lock.speedCap}</div>
                  </div>
                  <button 
                    onClick={() => {
                      setInterlocks(prev => prev.filter(i => i.id !== lock.id));
                      addActivityLog(`Interlock on ${lock.block} resolved manually via Safety Desk.`, 'SAFETY', 'success');
                      addToast(`Interlock ${lock.id} cleared successfully.`, 'success');
                    }}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded transition-colors shrink-0"
                  >
                    RESOLVE & CLEAR
                  </button>
                </div>
              ))
            )}
          </div>

          {/* Safety Activity Log */}
          <div className="bg-white rounded-xl p-5 shadow-sm border border-slate-200 space-y-3">
            <h2 className="font-mono text-xs font-bold text-slate-700 uppercase tracking-wider border-b border-slate-100 pb-2">
              Safety Audit Log
            </h2>
            <div className="space-y-2 font-mono text-xs max-h-80 overflow-y-auto">
              {activityLogs.map(l => (
                <div key={l.id} className="p-2.5 bg-slate-50 rounded border border-slate-200 flex justify-between">
                  <div>
                    <span className="font-bold text-railway-800">[{l.type}]</span> {l.text}
                  </div>
                  <span className="text-slate-400 text-[10px] shrink-0 ml-2">{l.time}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- MODULE FIVE: ANALYTICS & FITNESS REPORTS ---
    function ViewAnalytics({ rakes, metrics }) {
      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between pb-3 border-b border-slate-200 gap-3">
            <div>
              <div className="flex items-center space-x-2 font-mono text-xs text-slate-500 uppercase">
                <span>MODULE FIVE</span>
                <span>/</span>
                <span className="text-railway-800 font-bold">ANALYTICS & FITNESS</span>
              </div>
              <h1 className="text-2xl font-extrabold text-railway-900 tracking-tight font-mono">
                Fleet Performance & Fitness Reports
              </h1>
            </div>
            <div className="font-mono text-xs bg-slate-200 text-slate-700 px-2.5 py-1 rounded border border-slate-300">
              Monthly Operational Report
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 font-mono text-xs">
            <div className="bg-white p-4 rounded-xl border border-slate-200 space-y-1">
              <div className="text-[10px] text-slate-400 uppercase font-bold">Total Mileage Logged</div>
              <div className="text-2xl font-extrabold text-railway-900">1,083,720 km</div>
              <div className="text-emerald-600 text-[11px]">+4.2% from previous month</div>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 space-y-1">
              <div className="text-[10px] text-slate-400 uppercase font-bold">Energy Efficiency</div>
              <div className="text-2xl font-extrabold text-kmrl-darkteal">14.2 kWh / km</div>
              <div className="text-emerald-600 text-[11px]">Regenerative braking efficiency 22%</div>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 space-y-1">
              <div className="text-[10px] text-slate-400 uppercase font-bold">Fitness Compliance</div>
              <div className="text-2xl font-extrabold text-emerald-600">100% Valid</div>
              <div className="text-slate-500 text-[11px]">Zero expired certificates</div>
            </div>
          </div>

          {/* Detailed Fitness Expiry Table */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden font-mono text-xs">
            <div className="p-4 border-b border-slate-100 font-bold text-slate-800">
              Rake Fitness Certificate Renewal Matrix
            </div>
            <table className="w-full text-left">
              <thead>
                <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-[10px] uppercase">
                  <th className="p-3">Rake ID</th>
                  <th className="p-3">Fitness Expiry Date</th>
                  <th className="p-3">Current Mileage</th>
                  <th className="p-3">Health Score</th>
                  <th className="p-3">Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {rakes.map(r => (
                  <tr key={r.id}>
                    <td className="p-3 font-bold text-railway-900">{r.id}</td>
                    <td className="p-3 text-slate-700">{r.fitnessExp}</td>
                    <td className="p-3 text-slate-700">{r.mileage.toLocaleString()} km</td>
                    <td className="p-3 text-slate-700">{r.health}%</td>
                    <td className="p-3">
                      <span className="px-2 py-0.5 rounded text-[10px] bg-emerald-100 text-emerald-800 font-bold">
                        CERTIFIED
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- MODAL: DISPATCH EXTRA ---
    function DispatchExtraModal({ rakes, onClose, onDispatch }) {
      const [rakeId, setRakeId] = useState(rakes.find(r => r.status === 'Fit For Service')?.id || 'R-104');
      const [route, setRoute] = useState('S-01 (Aluva Northbound Express)');
      const [priority, setPriority] = useState('High');
      const [driver, setDriver] = useState('D-204 (Standby Driver)');

      return (
        <Modal title="OCC Dispatch Extra Train Consist" onClose={onClose}>
          <form onSubmit={(e) => { e.preventDefault(); onDispatch(rakeId, route, priority, driver); }} className="space-y-3 font-mono text-xs">
            <div>
              <label className="block text-slate-600 text-[10px] uppercase font-bold mb-1">Select Ready Rake</label>
              <select value={rakeId} onChange={e => setRakeId(e.target.value)} className="w-full p-2 border rounded bg-slate-50">
                {rakes.filter(r => r.status === 'Fit For Service').map(r => (
                  <option key={r.id} value={r.id}>{r.id} — Ready ({r.block})</option>
                ))}
              </select>
            </div>

            <div>
              <label className="block text-slate-600 text-[10px] uppercase font-bold mb-1">Target Route / Block</label>
              <input type="text" value={route} onChange={e => setRoute(e.target.value)} className="w-full p-2 border rounded bg-slate-50" />
            </div>

            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="block text-slate-600 text-[10px] uppercase font-bold mb-1">Priority</label>
                <select value={priority} onChange={e => setPriority(e.target.value)} className="w-full p-2 border rounded bg-slate-50">
                  <option value="High">High Priority</option>
                  <option value="Normal">Normal Service</option>
                </select>
              </div>

              <div>
                <label className="block text-slate-600 text-[10px] uppercase font-bold mb-1">Assign Driver</label>
                <input type="text" value={driver} onChange={e => setDriver(e.target.value)} className="w-full p-2 border rounded bg-slate-50" />
              </div>
            </div>

            <div className="flex justify-end space-x-2 pt-3 border-t">
              <button type="button" onClick={onClose} className="px-3 py-1.5 rounded text-slate-600 hover:bg-slate-100">Cancel</button>
              <button type="submit" className="px-4 py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded">
                EXECUTE DISPATCH
              </button>
            </div>
          </form>
        </Modal>
      );
    }

    // --- MODAL: EMERGENCY ALL STOP ---
    function EmergencyStopModal({ onClose, onConfirm }) {
      const [confirmPin, setConfirmPin] = useState('');
      const [error, setError] = useState('');

      const handleConfirm = (e) => {
        e.preventDefault();
        if (confirmPin === '1234' || confirmPin.toUpperCase() === 'CONFIRM') {
          onConfirm();
        } else {
          setError('Invalid Operator PIN. Enter "1234" or "CONFIRM" to authorize safety halt.');
        }
      };

      return (
        <Modal title="🚨 CONFIRM SYSTEM-WIDE ALL STOP PROTOCOL" onClose={onClose}>
          <form onSubmit={handleConfirm} className="space-y-4 font-sans text-xs">
            <div className="p-3 bg-red-100 border border-red-300 rounded text-red-900 font-mono">
              <div className="font-bold text-sm">WARNING: EMERGENCY ACTION</div>
              <p className="mt-1">
                Executing the All Stop Protocol will immediately switch all Line 1 signals to RED, cut traction current, and bring all active consists to an automatic emergency stop.
              </p>
            </div>

            <div>
              <label className="block font-bold text-slate-700 font-mono text-[10px] uppercase mb-1">
                Enter Operator Override PIN (Default: 1234 or "CONFIRM")
              </label>
              <input 
                type="password" 
                placeholder="Enter PIN..."
                value={confirmPin}
                onChange={e => { setConfirmPin(e.target.value); setError(''); }}
                className="w-full p-2 border border-slate-300 rounded font-mono text-sm focus:outline-none focus:border-red-500"
              />
              {error && <p className="text-red-600 text-[11px] font-mono mt-1">{error}</p>}
            </div>

            <div className="flex justify-end space-x-2 pt-3 border-t font-mono">
              <button type="button" onClick={onClose} className="px-3 py-1.5 rounded text-slate-600 hover:bg-slate-100">
                CANCEL
              </button>
              <button type="submit" className="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded shadow">
                EXECUTE ALL STOP
              </button>
            </div>
          </form>
        </Modal>
      );
    }

    // --- RENDER APP ---
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
